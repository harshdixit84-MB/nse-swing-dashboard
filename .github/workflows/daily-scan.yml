name: Daily NSE Swing Scan

on:
  schedule:
    # 8:30 UTC = 2:00 PM IST (mid-day check -- reads an INCOMPLETE candle, see README)
    - cron: "30 8 * * 1-5"
    # 10:30 UTC = 4:00 PM IST (after close -- reads the FINAL, confirmed daily candle)
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated data files

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # ALL_NSE mode scans ~2000 symbols; adjust if needed
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scanner
        run: pip install -r requirements.txt

      - name: Run scanner
        working-directory: scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Set to "ALL_NSE" to scan every listed NSE equity instead of
          # just the Nifty 500. Can also be set as a repo variable/secret.
          UNIVERSE_MODE: "NIFTY500"
        run: python scan.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/history.json
          git diff --staged --quiet || git commit -m "Scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
