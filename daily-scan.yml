name: Daily NSE Swing Scan

on:
  schedule:
    # 10:15 UTC = 3:45 PM IST, 15 minutes after NSE close.
    # Runs Mon-Fri only.
    - cron: "15 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated data files

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scanner
        run: pip install -r requirements.txt

      - name: Run scanner
        working-directory: scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/history.json
          git diff --staged --quiet || git commit -m "Daily scan: $(date -u +'%Y-%m-%d')"
          git push
